# Full stack in containers (Postgres + API + web), isolated from the dev stack in
# docker-compose.yml: its own project name, volume and host ports, so it can run next to
# `pnpm dev` and the dev database.
#
#   cp infra/.env.stack.example infra/.env.stack   # then set JWT_ACCESS_SECRET
#   docker compose -f infra/docker-compose.stack.yml --env-file infra/.env.stack up -d --build
#   docker compose -f infra/docker-compose.stack.yml --env-file infra/.env.stack run --rm seed
#
# Web http://localhost:3010 · API http://localhost:3011 · Postgres localhost:5434
name: erp-saas-stack

# The owner runs migrations and the seed; the API connects as erp_app, bound by RLS.
x-db-url: &db-url postgresql://erp:${POSTGRES_PASSWORD:-erp}@db:5432/erp?schema=public
x-app-db-url: &app-db-url postgresql://erp_app:${APP_DB_PASSWORD:-erp_app}@db:5432/erp?schema=public

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp}
      POSTGRES_DB: erp
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-erp_app}
    ports:
      - '${DB_PORT:-5434}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp -d erp']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    image: erp-saas/api:local
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: *app-db-url
      DATABASE_URL_MIGRATE: *db-url
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in infra/.env.stack}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3010}
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '${API_PORT:-3011}:3001'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/health || exit 1']
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  web:
    image: erp-saas/web:local
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the browser bundle at build time: rebuild after changing API_PORT.
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3011}
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - '${WEB_PORT:-3010}:3000'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # One-off: creates the demo company (`run --rm seed`). Uses the build stage, which
  # still has the dev dependencies (tsx) the seed script needs.
  seed:
    image: erp-saas/api-build:local
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: build
    working_dir: /repo/apps/api
    command: ['pnpm', 'db:seed']
    environment:
      DATABASE_URL_MIGRATE: *db-url
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-Demo1234!}
    depends_on:
      db:
        condition: service_healthy
    profiles: ['tools']

volumes:
  db_data:
