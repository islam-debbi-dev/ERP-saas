packages:
  - apps/*
  - packages/*

# Packages allowed to run install scripts (pnpm blocks them by default).
allowBuilds:
  '@prisma/engines': true
  prisma: true
  argon2: true
  esbuild: true
  # Downloads the headless Chrome used to render PDFs (skipped in the Docker image).
  puppeteer: true
  '@parcel/watcher': false
  unrs-resolver: false
  '@swc/core': false
