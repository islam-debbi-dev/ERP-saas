packages:
  - apps/*
  - packages/*

# Packages allowed to run install scripts (pnpm blocks them by default).
allowBuilds:
  '@prisma/engines': true
  prisma: true
  argon2: true
  esbuild: true
  # Downloads the headless Chrome used to render PDFs (skipped in the Docker image).
  puppeteer: true
  '@parcel/watcher': false
  unrs-resolver: false
  '@swc/core': false

# Security patches for transitive deps of @nestjs/platform-express (pnpm audit, high):
# body-parser < 2.4.0 (GHSA-27r3-jxmh-p828), multer < 2.5.0 (GHSA-q7qp-rjg7-q26m).
overrides:
  body-parser@2: ^2.4.0
  multer@2: ^2.5.0
