name: CI

# Pull requests; on main it runs as the first job of deploy.yml.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://erp:erp@localhost:5433/erp_test?schema=public
      DATABASE_URL_TEST: postgresql://erp:erp@localhost:5433/erp_test?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-not-used-anywhere-else-123456
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Known high/critical advisories in production dependencies fail the build.
      - run: pnpm audit --prod --audit-level high
      # Migrations must stay backward compatible with the running version (AGENTS.md §7).
      - run: pnpm --filter @erp/api db:check-migrations
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Backups end to end: WAL-G Postgres → S3 bucket → restore drill on a throwaway copy,
  # including rows written after the base backup (replayed from the WAL archive).
  restore-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: infra/ci/backup-drill-test.sh
