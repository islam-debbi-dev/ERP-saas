name: CI

# Pull requests; on main it runs as the first job of deploy.yml.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://erp:erp@localhost:5433/erp_test?schema=public
      DATABASE_URL_TEST: postgresql://erp:erp@localhost:5433/erp_test?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-not-used-anywhere-else-123456
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Known high/critical advisories in production dependencies fail the build.
      - run: pnpm audit --prod --audit-level high
      # Migrations must stay backward compatible with the running version (AGENTS.md §7).
      - run: pnpm --filter @erp/api db:check-migrations
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Backups end to end: WAL-G Postgres → S3 bucket → restore drill on a throwaway copy,
  # including rows written after the base backup (replayed from the WAL archive).
  restore-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: infra/ci/backup-drill-test.sh

  # Which parts of the repo changed, so the Flutter job only runs for the app.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
              - '.github/workflows/ci.yml'

  # The field app (apps/mobile, Flutter). Not a pnpm package: pnpm and turbo
  # ignore it, this job checks it.
  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Pinned to the Flutter the app is developed with (Dart 3.12).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      # The env file is gitignored but declared as an asset: CI builds with the
      # template (production API, no secret in it). The folder holds no tracked file,
      # so a fresh checkout does not have it.
      - run: mkdir -p assets/config && cp .env.example assets/config/env.default
      - run: flutter pub get
      # Generated code (json_serializable) must be committed and up to date.
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: git diff --exit-code -- lib
      - run: flutter analyze
      - run: flutter test
      # Debug key only: CI never sees an upload keystore.
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: debvora-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
