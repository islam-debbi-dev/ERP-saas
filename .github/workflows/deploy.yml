name: Deploy

# main → CI → images → staging (migrate, deploy, smoke test) → manual approval →
# production. The deploy jobs run once the server exists: set the repository
# variable DEPLOY_ENABLED=true and the secrets listed in docs/runbook.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      prefix: ${{ steps.names.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - id: names
        # GHCR names must be lowercase.
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: SENTRY_RELEASE=${{ github.sha }}
          tags: ${{ steps.names.outputs.prefix }}/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          # Same origin as the web app, behind Caddy: one image for staging and prod.
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.WEB_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_RELEASE=${{ github.sha }}
          tags: ${{ steps.names.outputs.prefix }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: postgres
        uses: docker/build-push-action@v6
        with:
          context: infra/postgres
          platforms: linux/amd64
          push: true
          # Named after its content: a deploy restarts the database only when it changes.
          tags: ${{ steps.names.outputs.prefix }}/postgres:16-walg-v3.0.8
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,scope=postgres,mode=max

  staging:
    needs: images
    if: vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: staging
      host_var: STAGING_HOST
    secrets: inherit

  production:
    needs: staging
    if: vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy-env.yml
    with:
      # The "production" GitHub environment has required reviewers: the run waits
      # here for a manual approval.
      environment: production
      host_var: PRODUCTION_HOST
    secrets: inherit
